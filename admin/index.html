<!DOCTYPE html>
<html lang="fr">

<head>
  <title>SAE2.03 ADMIN</title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./css/base.css" />
</head>

<body>
  <section id="log"></section>
  <section id="content"></section>
  <section id="contentprofile"></section>
  <section id="contentprofile2"></section>

  <script type="module">
    import { Log } from "./component/Log/script.js";
    import { MovieForm } from "./component/MovieForm/script.js"
    import { ProfileForm } from "./component/ProfileForm/script.js"

    import { DataMovie } from "./data/dataMovie.js"
    import { DataProfile } from "./data/dataProfile.js"

    let currentId = ""

    window.C = {};
    C.start = async function () {
      V.renderLog("Démarrage de l'application");
      let categories = await C.getCategories()
      V.renderMovieForm("C.handlerAddMovie()", categories)
      await C.getProfile("C.handlerAddProfile()")
    };

    C.getCategories = async function (){
      let data = await DataMovie.requestCategories();
      return data;
    }

    C.getProfile = async function(handler){
      let profiles = await DataProfile.read()
      V.renderProfileForm(handler, profiles)
    }
    
    C.handlerAddMovie = async function () {
      let form = document.querySelector('.movieform__form');
      if (!form.reportValidity()){
        return;
      }
      let fd = new FormData(form);
      let res = await DataMovie.add(fd);
      V.renderLog(res);
    }

    C.handlerAddProfile = async function () {
      let form = document.querySelector('.profileform__form');
      if (!form.reportValidity()){
        return;
      }
      let fd = new FormData(form);
      let res = await DataProfile.add(fd);
      V.renderLog(res);
    }

    // C.handlerUpdateProfile = async function () {
    //   let form = document.querySelector('.profileformupdate__form');
    //   if (!form.reportValidity()){
    //     return;
    //   }
    //   let fd = new FormData(form);
    //   let res = await DataProfile.add(fd);
    //   V.renderLog(res);
    // }
    

    window.V = {};

    V.renderLog = function (txt) {
      let content = document.querySelector("#log");
      content.innerHTML = Log.format(txt);
    };

    V.renderMovieForm = function (handler, categories) {
      let content = document.querySelector("#content");
      content.innerHTML = MovieForm.format(handler, categories)
    }

    V.renderProfileForm = function (handler, profiles) {
      console.log(profiles)
      let content = document.querySelector("#contentprofile");
      content.innerHTML = ProfileForm.format(handler, profiles)
    }

    C.start();
  </script>
</body>

</html>
