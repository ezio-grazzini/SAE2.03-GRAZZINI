<!DOCTYPE html>
<html lang="fr">

<head>
  <title>SAE2.03 APP</title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./css/base.css" />
</head>

<body>
  <header id="header"></header>

  <section id="content"></section>

  <script type="module">
    import { NavBar } from "./component/NavBar/script.js";
    import { Movie } from "./component/Movie/script.js";
    import { MovieDetail } from "./component/MovieDetail/script.js";
    import { MovieCategory } from "./component/MovieCategory/script.js";
    import { Profile } from "./component/Profile/script.js";
    import { Favorites } from "./component/Favorites/script.js";

    import { DataMovie } from "./data/dataMovie.js"
    import { DataProfile } from "./data/dataProfile.js"
    import { DataFavorites } from "./data/dataFavorites.js"

    // Controleur
    // Rappel, écrire window.C plutôt que let C est nécessaire pour tester depuis la console du navigateur
    // Une fois l'application terminée, on pourrait remettre let C.
    window.C = {};

    let currentId = 0;
    let currentAge = 0;

    C.getMovie = async function () {
      // let data = await DataMovie.requestMovies();

      if (data.length == 0) {
        alert("Aucun film disponible pour le moment.");
      } else {
        V.renderMovies(data);
      }
    }

    C.handlerAbout = function () {
      alert(
        "Ceci est une base de projet pour la SAE2.03 édition 2025. Bonne chance !"
      );
    };

    C.handlerHome = function () {
      C.getCategories(currentAge)
    };

    C.handlerProfile = function () {
      C.start()
    };

    C.handlerFavorites = function () {
      C.getFavorites(currentId)
    };

    C.handlerDetail = async function (id) {
      let data = await DataMovie.requestMovieDetails(id)
      V.renderMovieDetail(data)
    }

    C.start = async function () {
      await C.getProfile("C.handlerProfileSelect()")
    };

    C.getCategories = async function (age) {
      let categories = await DataMovie.requestCategories();
      let movies = await DataMovie.requestMovies(age);
      if (movies.length == 0) {
        alert("Aucun film disponible pour votre tranche d'âge");
      } else {
        V.renderMovieCategory(categories, movies, currentId)
        V.renderNavBar("C.handlerAbout()", "C.handlerHome()", "C.handlerProfile()", "C.handlerFavorites()");
      }
    }

    C.getProfile = async function (handler) {
      let profiles = await DataProfile.read()
      V.renderProfile(handler, profiles)
    }

    C.handlerProfileSelect = async function (id, age) {
      currentAge = age
      C.getCategories(currentAge)
      currentId = id
      C.read

    }

    C.addFavorites = async function (movie_id) {
      let Favorites = await DataFavorites.read(currentId)
      let Favorited = Favorites.some(fav => fav.id == movie_id)
      
      if (Favorited) {
        console.log("Le film est déjà en favoris")
      } else {
        alert(
          "Le film a été ajouté à vos favoris"
        );
        await DataFavorites.add(movie_id, currentId)
      }
    }

    C.getFavorites = async function (id) {
      let favorites = await DataFavorites.read(id)
      console.log(favorites)
      V.renderFavorites(favorites)
    }

    // Vue (contient tout ce qui est relatif à l'affichage)
    window.V = {};

    /**
     * V.renderNavBar
     *
     * Cette fonction est responsable de l'affichage de la barre de navigation (NavBar).
     * Elle sélectionne l'élément HTML avec l'ID "header" et y insère le contenu
     * formaté par le composant NavBar.
     */
    V.renderNavBar = function (hAbout, hHome, hProfile, hFavorites) {
      let header = document.querySelector("#header");
      header.innerHTML = NavBar.format(hAbout, hHome, hProfile, hFavorites);
    };

    V.renderMovies = function (data) {
      let content = document.querySelector("#content");
      content.innerHTML = Movie.format(data)
    }

    V.renderMovieDetail = function (data) {
      let content = document.querySelector("#content");
      content.innerHTML = MovieDetail.format(data)
    }

    V.renderMovieCategory = function (categories, movies) {
      let content = document.querySelector("#content");
      content.innerHTML = MovieCategory.format(categories, movies)
    }

    V.renderProfile = function (handler, profile) {
      let content = document.querySelector("#content");
      content.innerHTML = Profile.format(handler, profile)
    }

    V.renderFavorites = function (movies) {
      let content = document.querySelector("#content");
      content.innerHTML = Favorites.format(movies)
    }

    C.start(); // Démarre l'application
  </script>

</body>

</html>
<script type="module"></script>
