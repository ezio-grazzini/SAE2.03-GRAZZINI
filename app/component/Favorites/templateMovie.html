<li class="moviecard">
    <div class="moviecard__container">
        <div>
            <img class="moviecard__container-img alt="movie image" src="{{img}}" onclick="C.handlerDetail({id})">
        </div>
        <h3 class="moviecard__container-name">{{name}}</h3>
        <button onclick="C.removeFavorites({id})">Retirer des favoris</button>
    </div>
</li>
